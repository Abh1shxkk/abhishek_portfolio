<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Abhishek Chauhan, Full Stack Developer in Meerut. Laravel, React and AI-assisted tools that run in production for a university, its hospital and 100+ colleges. A 3D drive through the work." />
  <meta name="theme-color" content="#1f7a3f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Abhishek Chauhan | Portfolio</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong colours
    (function () {
      try {
        // ?theme=light|dark|system picks a theme for this visit (handy for sharing and testing)
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark' || q === 'system') localStorage.setItem('theme', q);
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) { }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bungee&family=Bungee+Shade&display=swap"
    rel="stylesheet">
  <script>
    const token = (name) => `rgb(var(--${name}) / <alpha-value>)`;
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Bungee', 'Impact', 'sans-serif'],
            shade: ['"Bungee Shade"', 'Bungee', 'Impact', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            paper: token('paper'),
            surface: token('surface'),
            ink: token('ink'),
            muted: token('muted'),
            line: token('line'),
            saffron: token('saffron'),
            amber: token('amber'),
            coral: token('coral'),
            rose: token('rose'),
            // Legacy names still used by the blog pages, mapped onto the new palette
            'geo-black': token('ink'),
            'geo-gray': token('paper'),
            'geo-line': token('line'),
            'geo-dark-bg': token('paper'),
            'geo-dark-card': token('surface'),
            'geo-dark-border': token('line'),
          },
          boxShadow: {
            soft: '0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px -12px rgb(0 0 0 / 0.12)',
            lift: '0 2px 4px rgb(0 0 0 / 0.04), 0 24px 48px -20px rgb(0 0 0 / 0.25)',
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
